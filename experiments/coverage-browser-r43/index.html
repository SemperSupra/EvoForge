<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EvoForge — systematic exploration preview</title><style>
:root{color-scheme:dark light;font-family:system-ui}body{max-width:1200px;margin:auto;padding:16px}h1{font-size:clamp(1.4rem,4vw,2rem)}button,select{font:inherit;min-height:44px;padding:6px 12px}header,nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#progress{min-height:3em;font-variant-numeric:tabular-nums}progress{width:100%}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin:12px 0}article{border:1px solid #8888;border-radius:8px;padding:8px;min-width:0}canvas{width:100%;aspect-ratio:3/2;display:block}article button{width:100%}dialog{max-width:min(90vw,700px);max-height:85dvh;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:640px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><h1>Systematic exploration</h1><p>Research preview: coarse fixed-seed grids, exact preview deduplication. Different recipes may converge at this resolution, but differ at higher resolution.</p><header><label for="engine">Engine</label><select id="engine"><option value="craft">Craft Lab</option><option value="emblem">Emblems</option><option value="motif">Motif Lab</option></select><button id="start">Explore</button><button id="cancel" disabled>Cancel</button><button id="export" disabled>Export index</button><button id="resume" disabled>Resume</button><button id="import">Import index</button><input id="import-file" type="file" accept="application/json,.json" hidden></header><section id="progress" role="status" aria-live="polite">Ready</section><progress id="bar" value="0" max="1"></progress><nav><button id="prev" disabled>Previous</button><span id="page">0 of 0</span><button id="next" disabled>Next</button></nav><main id="gallery" aria-label="Unique candidates"></main><dialog id="detail"><button id="close">Close</button><h2>Candidate provenance</h2><pre id="receipt"></pre></dialog><script type="module" src="./browser.mjs"></script></body></html>
