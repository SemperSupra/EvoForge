name: R47 interactive playback qualification
on:
  push:
    branches: [rdte/playback-interaction-r47]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 5174 > /tmp/r47.log 2>&1 &
          p1=$!
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/r47-mobile.log 2>&1 &
          p2=$!
          trap 'kill "$p1" "$p2" 2>/dev/null || true' EXIT
          node scripts/wait-for-server.mjs http://127.0.0.1:5174/
          node scripts/wait-for-server.mjs http://127.0.0.1:4173/
          EVOFORGE_SCREENSHOT_DIR=r47-desktop node scripts/playback-lenses-smoke.mjs
          node experiments/search-coverage-r39/mobile-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r47-playback-evidence
          path: |
            r47-desktop/
            mobile-evidence/
          retention-days: 30
