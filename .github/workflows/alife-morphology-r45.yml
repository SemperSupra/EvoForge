name: R45 anatomical mesh reference qualification
on:
  push:
    branches: [rdte/alife-morphology-r45]
permissions:
  contents: read
jobs:
  morphology:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: node --test experiments/alife-morphology-r45/morphology.node-check.mjs
      - run: node experiments/alife-morphology-r45/produce.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r45-anatomical-meshes
          path: morphology-evidence/
          retention-days: 30
