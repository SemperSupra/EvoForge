name: R41 real-render coverage bakeoff
on:
  push:
    branches: [rdte/coverage-bakeoff-r41]
    paths: ['experiments/coverage-bakeoff-r41/**','.github/workflows/coverage-bakeoff-r41.yml']
permissions:
  contents: read
jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        engine: [emblem, motif, craft]
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: node experiments/coverage-bakeoff-r41/benchmark.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r41-${{ matrix.engine }}-coverage
          path: coverage-evidence/
          retention-days: 30
