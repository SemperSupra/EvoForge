name: R49 bounded exploration policy
on:
  push:
    branches: [rdte/coverage-policy-r49]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: node --test experiments/coverage-browser-r43/policy.node-check.mjs experiments/coverage-browser-r43/persistence.node-check.mjs
