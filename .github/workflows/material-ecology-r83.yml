name: R83-R85 independent material ecology reference qualification
on:
  pull_request:
    branches: [rdte/mosaic-lens-workspace-r80]
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        lane: [material, thermal, gas-organ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: node --test experiments/material-ecology-r83/${{ matrix.lane }}.test.mjs
