name: Public Alpine release-source qualification
on:
  push:
    branches: [release-source]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  COMPILER: evoforge-alpine-compiler:node24-npm12
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rebuild from public pinned sources, then run two offline application builds
        run: |
          set -euo pipefail
          bash scripts/build-alpine-candidate.sh "$RUNNER_TEMP/candidate" "$GITHUB_SHA"
          for dir in evidence site package image-export; do mv "$RUNNER_TEMP/candidate/$dir" .; done
      - name: Refresh full compiler vulnerability assessment
        run: |
          set -euo pipefail
          test "$(cat evidence/source.txt)" = "$GITHUB_SHA"
          test "$(cat evidence/build-result.txt)" = PASS_BUILD_ONLY
          test "$(docker inspect "$COMPILER" --format '{{.Id}}')" = "$(cat evidence/compiler-id.txt)"
          curl -fsSL --proto '=https' https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln --pkg-types os,library --list-all-pkgs --format json --output evidence/compiler-audit.json --exit-code 0 "$COMPILER"
          "$RUNNER_TEMP/trivy" image --image-src docker --format cyclonedx --output evidence/compiler-sbom.json "$COMPILER"
          python3 - <<'PY'
          import json,collections
          a=json.load(open('evidence/compiler-audit.json'))
          r=a.get('Results',[])
          assert any(x.get('Class')=='os-pkgs' and x.get('Packages') for x in r)
          assert any(x.get('Type')=='node-pkg' and x.get('Packages') for x in r)
          counts=collections.Counter(v['Severity'] for x in r for v in x.get('Vulnerabilities') or [])
          print(dict(counts))
          assert not counts['CRITICAL'] and not counts['HIGH']
          PY
      - name: Record exact build and scanner gate
        run: printf 'PASS\n' > evidence/result.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-build-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-site
          path: site/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-build-package
          path: package/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-compiler-image
          path: image-export/
          if-no-files-found: error
          retention-days: 30
  isolated-browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-compiler-image
          digest-mismatch: error
          path: image-export
      - name: Restore exact previously tested compiler
        run: |
          set -euo pipefail
          (cd image-export && sha256sum -c SHA256SUMS)
          test "$(cat image-export/source.txt)" = "$GITHUB_SHA"
          gzip -dc image-export/compiler.docker.tar.gz | docker load
          test "$(docker inspect "$COMPILER" --format '{{.Id}}')" = "$(cat image-export/image-1.txt)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-site
          path: qualified-site
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-build-evidence
          path: prior
          digest-mismatch: error
      - name: Construct separate Alpine Chromium qualification candidate
        run: |
          set -euo pipefail
          test "$(cat prior/source.txt)" = "$GITHUB_SHA"
          test "$(cat prior/compiler-id.txt)" = "$(cat image-export/image-1.txt)"
          mkdir -p browser-context browser-evidence
          cat > browser-context/Dockerfile <<'DOCKER'
          ARG COMPILER
          FROM ${COMPILER}
          USER 0
          # Chromium needs full ICU; explicitly remove only the competing world constraint.
          RUN sed -i '/^icu-data-en\(=.*\)\?$/d' /etc/apk/world \
              && apk add --no-cache icu-data-full=78.1-r0 chromium=158.0.8127.36-r0 font-dejavu font-noto font-noto-cjk \
              && apk info -e icu-data-full && ! apk info -e icu-data-en
          USER 10001:10001
          DOCKER
          cp browser-context/Dockerfile browser-evidence/
          docker build --no-cache --build-arg COMPILER="$COMPILER" --iidfile browser-evidence/image.txt -f browser-context/Dockerfile browser-context
          image="$(cat browser-evidence/image.txt)"
          docker image inspect "$image" > browser-evidence/image.json
          docker run --rm --network none --entrypoint sh "$image" -ec 'apk info -v | sort; chromium --version; node --version; npm --version' > browser-evidence/packages-and-versions.txt
      - name: Scan actual browser candidate and retain full inventory
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          image="$(cat browser-evidence/image.txt)"
          "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln --pkg-types os,library --list-all-pkgs --format json --output browser-evidence/audit.json --exit-code 0 "$image"
          "$RUNNER_TEMP/trivy" image --image-src docker --format cyclonedx --output browser-evidence/sbom.json "$image"
          python3 - <<'PY'
          import json,collections,pathlib
          r=json.load(open('browser-evidence/audit.json'))['Results']
          assert any(x.get('Class')=='os-pkgs' and x.get('Packages') for x in r)
          assert any(x.get('Type')=='node-pkg' and x.get('Packages') for x in r)
          v=[v for x in r for v in x.get('Vulnerabilities') or []]
          summary={'counts':dict(collections.Counter(x['Severity'] for x in v)),'high_critical':[{'id':x['VulnerabilityID'],'package':x['PkgName'],'fixed':x.get('FixedVersion')} for x in v if x['Severity'] in ('HIGH','CRITICAL')]}
          pathlib.Path('browser-evidence/scan-summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary))
          PY
      - name: Exercise actual browser workload in a network-isolated container
        run: |
          set -euo pipefail
          image="$(cat browser-evidence/image.txt)"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          git archive HEAD | tar -x -C "$scratch"
          mkdir "$scratch/candidate" "$scratch/screenshots"
          cp -a qualified-site/. "$scratch/candidate/"
          cp prior/dist-1.sha256 "$scratch/dist.sha256"
          # Only adapt the test harness to select the system Chromium; no application changes.
          python3 - "$scratch" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          p=root/'scripts/golden-test.mjs'
          s=p.read_text()
          old='chromium.launch({args:isRoot?["--no-sandbox","--disable-dev-shm-usage"]:[]})'
          assert old in s
          p.write_text(s.replace(old,'chromium.launch({executablePath:process.env.EVOFORGE_CHROMIUM_EXECUTABLE,args:["--disable-dev-shm-usage"]})'))
          p=root/'scripts/production-smoke.mjs'
          s=p.read_text()
          assert 'chromium.launch()' in s
          p.write_text(s.replace('chromium.launch()','chromium.launch({executablePath:process.env.EVOFORGE_CHROMIUM_EXECUTABLE,args:["--disable-dev-shm-usage"]})'))
          PY
          cp "$scratch/scripts/golden-test.mjs" "$scratch/scripts/production-smoke.mjs" browser-evidence/
          args=(--rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges -e HOME=/tmp -v "$scratch:/workspace" -w /workspace --entrypoint sh)
          docker run "${args[@]}" "$image" -ec 'npm ci --ignore-scripts; npm audit --audit-level=low'
          docker run --network none "${args[@]}" "$image" -ec '
            export EVOFORGE_CHROMIUM_EXECUTABLE="$(command -v chromium || command -v chromium-browser)"
            export EVOFORGE_SCREENSHOT_DIR=/workspace/screenshots
            node scripts/verify-artifact.mjs candidate dist.sha256
            npm run dev -- --host 127.0.0.1 --port 5173 --strictPort >/tmp/oracle.log 2>&1 & p1=$!
            npm run preview -- --host 127.0.0.1 --port 5174 --strictPort --outDir /workspace/candidate >/tmp/site.log 2>&1 & p2=$!
            trap "kill $p1 $p2 2>/dev/null || true" EXIT
            node scripts/wait-for-server.mjs
            npm run golden:test
            node scripts/wait-for-server.mjs http://127.0.0.1:5174/
            node scripts/production-smoke.mjs
            node scripts/verify-artifact.mjs candidate dist.sha256
          ' 2>&1 | tee browser-evidence/workload.log
          cp -a "$scratch/screenshots" browser-evidence/
      - name: Require full candidate security coverage
        run: |
          set -euo pipefail
          python3 -c 'import json; assert not json.load(open("browser-evidence/scan-summary.json"))["high_critical"], "browser candidate has unresolved high/critical findings"'
          printf '%s\n' "$GITHUB_SHA" > browser-evidence/source.txt
          cp prior/dist-1.sha256 browser-evidence/
          printf 'PASS\n' > browser-evidence/result.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: candidate-browser-evidence
          path: browser-evidence/
          retention-days: 30

  metal:
    needs: build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-site
          path: candidate
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-build-evidence
          path: evidence
          digest-mismatch: error
      - name: Verify exact site and run native regression
        env:
          EVOFORGE_SMOKE_BACKEND: mac-metal
          EVOFORGE_DIST_DIR: candidate
          EVOFORGE_SCREENSHOT_DIR: metal-evidence/screenshots
        run: |
          set -euo pipefail
          test "$(cat evidence/source.txt)" = "$GITHUB_SHA"
          node scripts/verify-artifact.mjs candidate evidence/dist-1.sha256
          npm ci --ignore-scripts
          npm audit --audit-level=low
          npx playwright install chromium
          mkdir -p metal-evidence
          node scripts/arena-smoke.mjs | tee metal-evidence/workload.log
          node scripts/verify-artifact.mjs candidate evidence/dist-1.sha256
          printf '%s\n' "$GITHUB_SHA" > metal-evidence/source.txt
          cp evidence/dist-1.sha256 metal-evidence/
          sw_vers > metal-evidence/os.txt
          printf 'PASS\n' > metal-evidence/result.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: candidate-metal-evidence
          path: metal-evidence/
          retention-days: 30
  provenance:
    needs: [build, isolated-browser, metal]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-site
          path: site
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-build-evidence
          path: build-evidence
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-build-package
          path: package
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-browser-evidence
          path: browser-evidence
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-metal-evidence
          path: metal-evidence
          digest-mismatch: error
      - name: Verify same-run source and artifact receipts
        run: |
          set -euo pipefail
          for dir in build-evidence browser-evidence metal-evidence; do
            test "$(cat "$dir/source.txt")" = "$GITHUB_SHA"
            test "$(cat "$dir/result.txt")" = PASS
            cmp "$dir/dist-1.sha256" build-evidence/dist-1.sha256
          done
          (cd package && sha256sum -c SHA256SUMS)
          mkdir extracted
          tar -xf package/evoforge-site.tar -C extracted
          node scripts/verify-artifact.mjs extracted build-evidence/dist-1.sha256
          node scripts/verify-artifact.mjs site build-evidence/dist-1.sha256
          cp build-evidence/dist-1.sha256 package/
          printf '%s\n' "$GITHUB_SHA" > package/source.txt
          printf '%s\n' "$GITHUB_RUN_ID" > package/run.txt
          printf '%s\n' 'Built by this exact workflow run; compiler scan, isolated Chromium, native Metal and distribution checks passed. Candidate only; no deployment or approval.' > package/SCOPE.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        id: attest
        with:
          subject-path: package/evoforge-site.tar
      - name: Verify same-run signed build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify package/evoforge-site.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/public-qualification.yml" --format json > package/provenance-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-release-candidate
          path: |
            package/
            ${{ steps.attest.outputs.bundle-path }}
          retention-days: 30
