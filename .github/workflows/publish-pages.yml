name: Guarded EvoForge Pages promotion
on:
  push:
    branches: [rdte/readiness-probe-r19, gh-pages]
    paths: ['.github/workflows/alpine-promotion-preflight.yml', '.github/release-approvals/02d587a-41e4c5bc.json']
  workflow_dispatch:
    inputs:
      promotion:
        description: 'Promote exact RC source 02d587a and signed subject 41e4c5bc, or preflight only'
        type: choice
        required: true
        default: preflight-only
        options:
          - preflight-only
          - deploy-02d587a-41e4c5bc
concurrency:
  group: evoforge-guarded-pages-promotion
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  RELEASE_SOURCE: 02d587a0d684fb59af5d097ca6b81dfd5c87bf0a
  RELEASE_RUN: '46086500560'
  SUBJECT_SHA: 41e4c5bc9f658cb4a21a4803412170679146bc6065de75ee7ea77b92a0bd6c82
  MANIFEST_SHA: bd4a36625418c9efb946f110534ac390593de31ab5fd8832a2cb58b9c32d8e1e
jobs:
  promotion-preflight:
    if: github.repository == 'SemperSupra/EvoForge'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
      authorized: ${{ steps.authorize.outputs.authorized }}
    permissions:
      contents: read
      actions: read
      attestations: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d587a0d684fb59af5d097ca6b81dfd5c87bf0a
          persist-credentials: false
      - name: Bind explicit promotion authority to exact candidate
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.promotion == 'deploy-02d587a-41e4c5bc' }}
          PUSH_REQUEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/gh-pages' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          authorized=false
          if [ "$MANUAL_REQUEST" = true ]; then
            test "$GITHUB_REF" = refs/heads/gh-pages
            authorized=true
          elif [ "$PUSH_REQUEST" = true ]; then
            # An approval is a single newly added exact receipt, never a generic branch push.
            gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$GITHUB_SHA" > "$RUNNER_TEMP/evoforge-approval-diff.json"
            python3 - <<'PY'
          import json,os,pathlib
          diff=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'evoforge-approval-diff.json').read_text())
          assert diff['status']=='ahead' and diff['total_commits']==1
          assert [(f['filename'],f['status']) for f in diff['files']]==[('.github/release-approvals/02d587a-41e4c5bc.json','added')]
          PY
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/release-approvals/02d587a-41e4c5bc.json?ref=$GITHUB_SHA" --jq .content | base64 -d > "$RUNNER_TEMP/evoforge-approval.json"
            python3 - <<'PY'
          import json,os,pathlib
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'evoforge-approval.json').read_text())
          assert receipt=={'action':'promote','source':os.environ['RELEASE_SOURCE'],'qualified_run':os.environ['RELEASE_RUN'],'subject':os.environ['SUBJECT_SHA'],'manifest':os.environ['MANIFEST_SHA']}
          PY
            authorized=true
          fi
          printf 'authorized=%s\n' "$authorized" >> "$GITHUB_OUTPUT"
      - name: Bind exact current release source, workflow and successful jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir preflight
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release-source" --jq .object.sha)" = "$RELEASE_SOURCE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > preflight/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/jobs?per_page=100" > preflight/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/artifacts?per_page=100" > preflight/artifacts.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('preflight/run.json'))
          assert r['head_sha']==os.environ['RELEASE_SOURCE']
          assert r['head_branch']=='release-source' and r['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert r['path'].split('@')[0]=='.github/workflows/public-qualification.yml'
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['event'] in ('push','workflow_dispatch')
          jobs=json.load(open('preflight/jobs.json'))['jobs']
          assert {j['name'] for j in jobs}=={'build','isolated-browser','metal','provenance'}
          assert all(j['conclusion']=='success' for j in jobs)
          a={x['name']:x for x in json.load(open('preflight/artifacts.json'))['artifacts']}
          expected={'signed-release-candidate':(15239506884,'sha256:cf41940507a54b96a68771f5e4fc5cca9f1f4c51d564b83b3c913e28a4dcd279'),'candidate-site':(15239546483,'sha256:b961dc53d4b5a358042a98daa61384cdf37f94a925d486d61196293553dfb439'),'candidate-build-evidence':(15239063342,'sha256:2070d226ca18b73acbff39fd0b65fa28a8a4f52783cb5c04a4eee1bcb29006f7')}
          for name,(ident,digest) in expected.items():
              assert a[name]['id']==ident and a[name]['digest']==digest and not a[name]['expired']
          print('PASS exact release source, successful job graph and artifact identity')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: signed-release-candidate
          run-id: 46086500560
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-site
          run-id: 46086500560
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: site
      - name: Reverify signed subject and exact source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The signed artifact includes the package directory and a separate attestation bundle.
          # Admit only one package root matching the observed archive layout.
          test -f signed/EvoForge/EvoForge/package/evoforge-site.tar
          mkdir verified-package
          for file in source.txt run.txt evoforge-site.tar dist-1.sha256 SHA256SUMS; do
            test -f "signed/EvoForge/EvoForge/package/$file"
            test ! -L "signed/EvoForge/EvoForge/package/$file"
            cp "signed/EvoForge/EvoForge/package/$file" verified-package/
          done
          test "$(cat verified-package/source.txt)" = "$RELEASE_SOURCE"
          test "$(cat verified-package/run.txt)" = "$RELEASE_RUN"
          printf '%s  %s\n' "$SUBJECT_SHA" verified-package/evoforge-site.tar "$MANIFEST_SHA" verified-package/dist-1.sha256 | sha256sum -c -
          gh attestation verify --help > preflight/attestation-help.txt
          grep -q -- '--source-digest' preflight/attestation-help.txt
          gh attestation verify verified-package/evoforge-site.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/public-qualification.yml" --source-digest "$RELEASE_SOURCE" --format json > preflight/attestation-verification.json
          node scripts/verify-artifact.mjs site verified-package/dist-1.sha256
          node scripts/verify-dist.mjs site
          python3 - <<'PY'
          import pathlib,tarfile,hashlib,json,re
          root=pathlib.Path('site')
          expected={x.split('  ',1)[1][2:]:x.split('  ',1)[0] for x in pathlib.Path('verified-package/dist-1.sha256').read_text().splitlines()}
          found={}
          with tarfile.open('verified-package/evoforge-site.tar','r:') as t:
              for m in t:
                  path=m.name.removeprefix('./')
                  assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
                  if m.isdir():
                      assert path in ('','.','assets','experiences','experiences/alife'),path
                      continue
                  assert m.isfile() and path in expected and path not in found,path
                  found[path]=hashlib.sha256(t.extractfile(m).read()).hexdigest()
          assert found==expected and len(found)==13
          descriptor=json.load(open(root/'release.json'))
          assert descriptor.get('promotion')!='approved','preflight expects an unpromoted candidate'
          print('PASS signed tar equals exact allowlisted site; descriptor is not promotion-approved')
          PY
      - name: Read Pages configuration without modifying it
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_REQUEST: ${{ steps.authorize.outputs.authorized }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,html_url,status,source}' > preflight/pages.json; then
            python3 - <<'PY'
          import json
          p=json.load(open('preflight/pages.json'))
          print(json.dumps({'pages_configuration':p,'actions_publishing_observed':p.get('build_type')=='workflow','release_authorized':False}))
          PY
          else
            printf '%s\n' '{"status":"CONFIGURATION_UNAVAILABLE","release_authorized":false}' > preflight/pages.json
          fi
          printf '%s\n' 'Read-only preflight; no Pages mutation, deployment approval or blanket legal/security clearance.' > preflight/SCOPE.txt
          ready="$(python3 -c 'import json; p=json.load(open("preflight/pages.json")); print(str(p.get("build_type")=="workflow").lower())')"
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          if [ "$PROMOTION_REQUEST" = true ]; then
            test "$GITHUB_REF" = refs/heads/gh-pages
            test "$ready" = true
          fi
          cp verified-package/dist-1.sha256 preflight/
          printf '%s\n' "$RELEASE_SOURCE" > preflight/source.txt
          printf '%s\n' "$RELEASE_RUN" > preflight/qualified-run.txt
          printf '%s\n' "$SUBJECT_SHA" > preflight/subject.txt
          printf '%s\n' 'PASS_ARTIFACT_PREFLIGHT' > preflight/result.txt
      - name: Configure Pages only for an authorized deployment request
        if: github.ref == 'refs/heads/gh-pages' && steps.authorize.outputs.authorized == 'true' && steps.pages.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: false
      - name: Package verified public site with official Pages action
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
          name: github-pages
          retention-days: 1
      - name: Independently verify exact contents of official Pages upload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,tarfile,hashlib,os,json
          expected={line.split('  ',1)[1][2:]:line.split('  ',1)[0] for line in pathlib.Path('preflight/dist-1.sha256').read_text().splitlines()}
          found={}
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'artifact.tar','r:') as t:
              for member in t:
                  path=member.name.removeprefix('./')
                  if member.isdir():
                      assert path in ('','.','assets','experiences','experiences/alife'),path
                      continue
                  assert member.isfile() and path in expected and path not in found,path
                  found[path]=hashlib.sha256(t.extractfile(member).read()).hexdigest()
          assert found==expected and len(found)==13
          pathlib.Path('preflight/pages-package.json').write_text(json.dumps({'file_count':len(found),'manifest_match':True,'source':os.environ['RELEASE_SOURCE']},indent=2))
          print('PASS official Pages archive: exactly 13 verified website files')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-promotion-preflight
          path: preflight/
          retention-days: 30
  deploy:
    needs: promotion-preflight
    if: github.repository == 'SemperSupra/EvoForge' && github.ref == 'refs/heads/gh-pages' && needs.promotion-preflight.outputs.authorized == 'true' && needs.promotion-preflight.outputs.pages_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject drift immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release-source" --jq .object.sha)" = "$RELEASE_SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow
      - name: Deploy exact owner-selected qualified candidate
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
  live-acceptance:
    needs: [promotion-preflight, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-promotion-preflight
          path: preflight
          digest-mismatch: error
      - name: Verify all deployed files over HTTPS
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir live-evidence
          python3 - <<'PY'
          import urllib.request,urllib.parse,hashlib,pathlib,json,time,os
          base='https://sempersupra.github.io/EvoForge/'
          assert os.environ['PAGE_URL'].rstrip('/')==base.rstrip('/')
          expected={line.split('  ',1)[1][2:]:line.split('  ',1)[0] for line in pathlib.Path('preflight/dist-1.sha256').read_text().splitlines()}
          assert len(expected)==13
          results={}
          for attempt in range(12):
              results={}
              for path,digest in expected.items():
                  url=base+urllib.parse.quote(path,safe='/')+'?qualification='+os.environ['RELEASE_SOURCE']
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'EvoForge-live-acceptance'})
                      with urllib.request.urlopen(req,timeout=8) as r:
                          final=urllib.parse.urlsplit(r.url)
                          assert final.scheme=='https' and final.netloc=='sempersupra.github.io' and final.path.startswith('/EvoForge/')
                          actual=hashlib.sha256(r.read(2*1024*1024+1)).hexdigest()
                          results[path]={'expected':digest,'actual':actual,'pass':actual==digest}
                  except Exception as exc:
                      results[path]={'expected':digest,'pass':False,'error':str(exc)}
              if all(r['pass'] for r in results.values()): break
              time.sleep(10)
          report={'url':base,'source':os.environ['RELEASE_SOURCE'],'qualified_run':os.environ['RELEASE_RUN'],'files':results,'pass':all(r['pass'] for r in results.values())}
          pathlib.Path('live-evidence/acceptance.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          assert report['pass'],'Deployed site not yet accepted; inspect evidence before recovery'
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: live-pages-acceptance
          path: live-evidence/
          retention-days: 30
# Exact candidate promotion: protected default-branch approval receipt or explicit manual selection; all integrity and environment gates retained.
