name: R68 native learning media evidence
on:
  push:
    branches: [rdte/native-learning-media-r68]
permissions:
  contents: read
jobs:
  native-record:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run build
      - run: node experiments/native-learning-media-r68/record.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r68-native-learning-media
          path: native-learning-evidence/
          retention-days: 30
