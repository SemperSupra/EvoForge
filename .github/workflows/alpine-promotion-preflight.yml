name: Release promotion preflight and worker boundary diagnostics
on:
  push:
    branches: [rdte/readiness-probe-r19]
    paths: ['.github/workflows/alpine-promotion-preflight.yml']
permissions:
  contents: read
  actions: read
env:
  RELEASE_SOURCE: 86755c2bf87dd5230141d84ece273b3b43575eee
  RELEASE_RUN: '46046303072'
  SUBJECT_SHA: 2fbb903e0897c62df5552d9757a9a642a807350695c562f957156d639721bcf5
  MANIFEST_SHA: 762d7277073c626f9f4a6a72554529b3e5d4f1a2a66692d191eb9f8aabdaa7ec
jobs:
  promotion-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      attestations: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 86755c2bf87dd5230141d84ece273b3b43575eee
          persist-credentials: false
      - name: Bind exact current release source, workflow and successful jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir preflight
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release-source" --jq .object.sha)" = "$RELEASE_SOURCE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > preflight/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/jobs?per_page=100" > preflight/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/artifacts?per_page=100" > preflight/artifacts.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('preflight/run.json'))
          assert r['head_sha']==os.environ['RELEASE_SOURCE']
          assert r['head_branch']=='release-source' and r['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert r['path'].split('@')[0]=='.github/workflows/public-qualification.yml'
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['event'] in ('push','workflow_dispatch')
          jobs=json.load(open('preflight/jobs.json'))['jobs']
          assert {j['name'] for j in jobs}=={'build','isolated-browser','metal','provenance'}
          assert all(j['conclusion']=='success' for j in jobs)
          a={x['name']:x for x in json.load(open('preflight/artifacts.json'))['artifacts']}
          expected={'signed-release-candidate':(15222632423,'sha256:3790a72dac90bf4961f610b82fca767142b2b62a906c5f7867794089b530aa8f'),'candidate-site':(15223410739,'sha256:f674b23117712e456cdfd575cc0a305af01c1ac7b170d8b2fee928350b31393b'),'candidate-build-evidence':(15223100890,'sha256:e2ad4ef3327f78a05413f9aff29eeff5c8d7f5a2f7896e745d323eba808bbc8a')}
          for name,(ident,digest) in expected.items():
              assert a[name]['id']==ident and a[name]['digest']==digest and not a[name]['expired']
          print('PASS exact release source, successful job graph and artifact identity')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: signed-release-candidate
          run-id: 46046303072
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-site
          run-id: 46046303072
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: site
      - name: Reverify signed subject and exact source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat signed/source.txt)" = "$RELEASE_SOURCE"
          test "$(cat signed/run.txt)" = "$RELEASE_RUN"
          printf '%s  %s\n' "$SUBJECT_SHA" signed/evoforge-site.tar "$MANIFEST_SHA" signed/dist-1.sha256 | sha256sum -c -
          gh attestation verify --help > preflight/attestation-help.txt
          grep -q -- '--source-digest' preflight/attestation-help.txt
          gh attestation verify signed/evoforge-site.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/public-qualification.yml" --source-digest "$RELEASE_SOURCE" --format json > preflight/attestation-verification.json
          node scripts/verify-artifact.mjs site signed/dist-1.sha256
          node scripts/verify-dist.mjs site
          python3 - <<'PY'
          import pathlib,tarfile,hashlib,json,re
          root=pathlib.Path('site')
          expected={x.split('  ',1)[1][2:]:x.split('  ',1)[0] for x in pathlib.Path('signed/dist-1.sha256').read_text().splitlines()}
          found={}
          with tarfile.open('signed/evoforge-site.tar','r:') as t:
              for m in t:
                  path=m.name.removeprefix('./')
                  assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
                  if m.isdir():
                      assert path in ('','.','assets','experiences','experiences/alife'),path
                      continue
                  assert m.isfile() and path in expected and path not in found,path
                  found[path]=hashlib.sha256(t.extractfile(m).read()).hexdigest()
          assert found==expected and len(found)==13
          descriptor=json.load(open(root/'release.json'))
          assert descriptor.get('promotion')!='approved','preflight expects an unpromoted candidate'
          print('PASS signed tar equals exact allowlisted site; descriptor is not promotion-approved')
          PY
      - name: Read Pages configuration without modifying it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,html_url,status,source}' > preflight/pages.json; then
            python3 - <<'PY'
          import json
          p=json.load(open('preflight/pages.json'))
          print(json.dumps({'pages_configuration':p,'actions_publishing_observed':p.get('build_type')=='workflow','release_authorized':False}))
          PY
          else
            printf '%s\n' '{"status":"CONFIGURATION_UNAVAILABLE","release_authorized":false}' > preflight/pages.json
          fi
          printf '%s\n' 'Read-only preflight; no Pages mutation, deployment approval or blanket legal/security clearance.' > preflight/SCOPE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-promotion-preflight
          path: preflight/
          retention-days: 30
  worker-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 86755c2bf87dd5230141d84ece273b3b43575eee
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Probe existing worker lifecycle without modifying product code
        run: |
          set -euo pipefail
          mkdir worker-evidence
          node --input-type=module <<'JS' | tee worker-evidence/observations.json
          import {WorkerLifecycle} from './src/workers/worker-lifecycle.mjs';
          import assert from 'node:assert/strict';
          import {setTimeout as sleep} from 'node:timers/promises';
          const workers=[],results=[];
          const pool=new WorkerLifecycle(2,()=>{
            const w={sent:[],terminated:0,postMessage(j){this.sent.push(j)},terminate(){this.terminated++}};
            workers.push(w);return w;
          });
          pool.onMessage(m=>results.push(m));
          const job=i=>({type:'render',jobId:'probe-'+i,generationId:1,renderIntentId:1,candidateId:'c'+i,slot:'thumb',engineId:'mosaic',engineVersion:'2.0.0',genomeQ16:new Uint16Array([1,2]),engineConfig:{},intent:{kind:'thumb',width:2,height:2,lod:0}});
          const hung=job(1),healthy=job(2);
          pool.post(hung);pool.post(healthy);
          workers[1].onmessage({data:{type:'result',jobId:healthy.jobId,generationId:1,renderIntentId:1,candidateId:healthy.candidateId,slot:'thumb',width:2,height:2,rgba:new Uint8ClampedArray(16),meta:{}}});
          await sleep(1000);
          assert.equal(results.length,1);
          assert.equal(pool.stats().pending,1);
          const waiting=pool.stats();
          pool.terminate();
          await Promise.resolve();
          assert.equal(results.length,2);
          assert.equal(results[1].jobId,hung.jobId);
          assert.equal(results[1].type,'error');
          assert.equal(pool.stats().pending,0);
          console.log(JSON.stringify({source:process.env.RELEASE_SOURCE,scope:'synthetic one-second nonresponse probe; not a product endurance or deadline acceptance test',healthySiblingCompleted:true,hungPendingAfterMs:1000,waiting,explicitPoolCancellation:true,terminal:pool.stats(),automaticDeadlineDemonstrated:false},null,2));
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: worker-boundary-diagnostics
          path: worker-evidence/
          retention-days: 30
