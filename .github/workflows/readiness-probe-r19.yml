name: Readiness probe qualification
on:
  push:
    branches: [rdte/readiness-probe-r19]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'SemperSupra/EvoForge'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: node --test scripts/wait-for-server.test.mjs
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify committed qualified manifests
        run: |
          printf '%s  %s\n' 7552f1df20b233b04da2040c36eb5a992a262d7558149d1092c6deb9bb8e5812 package.json 65b6c770ed63455930bdc84c42aa9d00bd57f66ce6dd13943aa6af5baf2f8214 package-lock.json | sha256sum -c -
      - name: Run canonical container gates
        env:
          EVOFORGE_ZERO_COST: '1'
          EVOFORGE_QUALIFICATION_PHASE: container
        run: |
          bash scripts/rdte-direct.sh "$(git rev-parse HEAD)" "$RUNNER_TEMP/evoforge-dist"
      - name: Inventory and scan actual tooling image
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/evoforge-dist.evidence"
          image="$(cat "$E/image-id.txt")"
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker run --rm --network none "$image" dpkg-query -W > "$E/os-packages.tsv"
          curl --fail --silent --show-error --location --proto '=https' https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version > "$E/scanner-version.txt"
          "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln --pkg-types os --format json --output "$E/os-audit.json" --exit-code 0 "$image"
          python3 - "$E/os-audit.json" <<'PY'
          import json,sys,collections
          a=json.load(open(sys.argv[1]))
          assert a.get('Results') and any(r.get('Class')=='os-pkgs' for r in a['Results']), 'OS scan missing'
          v=[v for r in a['Results'] for v in (r.get('Vulnerabilities') or [])]
          print(dict(collections.Counter(x['Severity'] for x in v)))
          assert not any(x['Severity'] in ('HIGH','CRITICAL') for x in v), 'OS advisory review required'
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrated-site
          path: ${{ runner.temp }}/evoforge-dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integrated-evidence
          path: ${{ runner.temp }}/evoforge-dist.evidence/
  native:
    needs: container
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integrated-site
          path: ${{ runner.temp }}/evoforge-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integrated-evidence
          path: ${{ runner.temp }}/evidence
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npx playwright install chromium
      - name: Verify exact artifact and full native smoke
        env:
          EVOFORGE_SMOKE_BACKEND: mac-metal
          EVOFORGE_DIST_DIR: ${{ runner.temp }}/evoforge-dist
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/evidence"
          test "$(cat "$E/native-source.txt")" = "source=$(git rev-parse HEAD)"
          test "$(cat "$E/gates.tsv")" = "$(printf '%s\tPASS\n' install chromium typecheck unit build dist golden)"
          (cd "$EVOFORGE_DIST_DIR" && shasum -a 256 -c "$E/dist-sha256.txt")
          node scripts/arena-smoke.mjs
          (cd "$EVOFORGE_DIST_DIR" && shasum -a 256 -c "$E/dist-sha256.txt")
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Generate lock-bound inventory and resolve base image
        run: |
          set -euo pipefail
          mkdir -p supply-evidence
          npm sbom --package-lock-only --sbom-format cyclonedx > supply-evidence/npm-all.cdx.json
          npm sbom --package-lock-only --omit=dev --sbom-format cyclonedx > supply-evidence/npm-runtime.cdx.json
          npm audit --json > supply-evidence/audit.json
          docker buildx imagetools inspect node:22-trixie-slim@sha256:f0960f8dc047f358e3fb428f36ccba21732194fa5f0cac849f401e63e62fb9e6 > supply-evidence/base-image.txt
          docker buildx imagetools inspect --raw node:22-trixie-slim@sha256:f0960f8dc047f358e3fb428f36ccba21732194fa5f0cac849f401e63e62fb9e6 > supply-evidence/base-manifest.json
          sha256sum package.json package-lock.json Dockerfile.tooling > supply-evidence/inputs.sha256
          git rev-parse HEAD > supply-evidence/source.txt
          node --version > supply-evidence/node.txt
          npm --version > supply-evidence/npm.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: supply-chain-evidence
          path: supply-evidence/
          if-no-files-found: error
          retention-days: 14
  provenance:
    needs: [probe, container, native, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integrated-site
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integrated-evidence
          path: evidence
      - name: Verify and package exact qualified distribution
        run: |
          set -euo pipefail
          test "$(cat evidence/native-source.txt)" = "source=$GITHUB_SHA"
          (cd site && sha256sum -c ../evidence/dist-sha256.txt)
          (cd site && find . -type f -print0 | sort -z | xargs -0 -r sha256sum) | cmp - evidence/dist-sha256.txt
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf qualified-site.tar -C site .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: qualified-site.tar
      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify qualified-site.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/readiness-probe-r19.yml" --format json > provenance-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-qualified-site
          path: |
            qualified-site.tar
            provenance-verification.json
            ${{ steps.attest.outputs.bundle-path }}
          retention-days: 14
