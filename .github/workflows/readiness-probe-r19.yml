name: Readiness probe qualification
on:
  push:
    branches: [rdte/readiness-probe-r19]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'SemperSupra/EvoForge'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/wait-for-server.test.mjs
