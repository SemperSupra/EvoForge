name: Bakeoff split native qualification
on:
  push:
    branches: [rdte/readiness-probe-r19]
    paths: ['.github/workflows/os-bakeoff-native.yml']
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: [alpine, suse]
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dde7f1d29d5ec2798eae87546dbc773da85ef894
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bakeoff-${{ matrix.candidate }}
          run-id: 45999922471
          github-token: ${{ github.token }}
          path: candidate
          digest-mismatch: error
      - name: Verify common exact artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('candidate')
          manifest=(p/'dist-1.sha256').read_bytes()
          assert hashlib.sha256(manifest).hexdigest()=='4f269bfce25085ada3fcc63441f6c7a116fe7439ceeeac4e7d3188dcda07f39a'
          assert manifest==(p/'dist-2.sha256').read_bytes()
          for n in (1,2):
              root=p/f'dist-{n}'
              found={ './'+f.relative_to(root).as_posix():hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file() and not f.is_symlink()}
              expected={line.split('  ',1)[1]:line.split('  ',1)[0] for line in manifest.decode().splitlines()}
              assert found==expected
          PY
          node scripts/verify-dist.mjs candidate/dist-1
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: npx playwright install chromium
      - name: Golden checks against candidate built site
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python3 -m http.server 5173 --bind 127.0.0.1 --directory candidate/dist-1 > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/wait-for-server.mjs
          npm run golden:test
      - name: Full native Metal smoke against candidate built site
        if: runner.os == 'macOS'
        env:
          EVOFORGE_SMOKE_BACKEND: mac-metal
          EVOFORGE_DIST_DIR: candidate/dist-1
        run: node scripts/arena-smoke.mjs
      - name: Verify tested artifact remained unchanged
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          root=pathlib.Path('candidate/dist-1')
          expected={line.split('  ',1)[1]:line.split('  ',1)[0] for line in pathlib.Path('candidate/dist-1.sha256').read_text().splitlines()}
          found={'./'+f.relative_to(root).as_posix():hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file() and not f.is_symlink()}
          assert found==expected
          PY
