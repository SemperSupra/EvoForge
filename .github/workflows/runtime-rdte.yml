name: Public runtime RDTE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu:
    if: ${{ github.repository == 'SemperSupra/EvoForge' && github.ref == 'refs/heads/release-source' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, profile: linux-swiftshader }
          - { runner: macos-26, profile: mac-headed }
          - { runner: macos-26, profile: mac-headless }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: npx playwright install chromium
      - run: node scripts/arena-runtime-rdte.mjs ${{ matrix.profile }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: runtime-${{ matrix.profile }}
          path: runtime-evidence/
          retention-days: 3
  storage:
    if: ${{ github.repository == 'SemperSupra/EvoForge' && github.ref == 'refs/heads/release-source' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, engine: chromium }
          - { runner: ubuntu-24.04, engine: firefox }
          - { runner: macos-26, engine: webkit }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - if: runner.os == 'macOS'
        run: npx playwright install ${{ matrix.engine }}
      - run: node scripts/storage-rdte.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: storage-${{ matrix.engine }}
          path: runtime-evidence/
          retention-days: 3
