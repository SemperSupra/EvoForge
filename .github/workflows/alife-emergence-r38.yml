name: R38 independent ALife reference qualification
on:
  push:
    branches: [rdte/alife-emergence-r38]
    paths: ['experiments/alife-emergence-r38/**','.github/workflows/alife-emergence-r38.yml']
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        lane: [communication, physiology, ecology]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: |
          set -euo pipefail
          mkdir evidence
          node --test experiments/alife-emergence-r38/${{ matrix.lane }}.test.mjs | tee evidence/tests.txt
          printf '%s\n' "$GITHUB_SHA" > evidence/source.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r38-${{ matrix.lane }}-evidence
          path: evidence/
          retention-days: 14
