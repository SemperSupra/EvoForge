name: R43 systematic browser qualification
on:
  push:
    branches: [rdte/coverage-browser-r43]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit chromium
      - run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort >/tmp/r43.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/wait-for-server.mjs http://127.0.0.1:5173/
          node experiments/coverage-browser-r43/browser-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r43-browser-evidence
          path: r43-browser-evidence/
          retention-days: 30
