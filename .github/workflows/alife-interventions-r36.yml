name: R36 environmental intervention reference qualification
on:
  push:
    branches: [rdte/alife-interventions-r36]
    paths: ['experiments/alife-interventions-r36/**','.github/workflows/alife-interventions-r36.yml']
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: |
          set -euo pipefail
          mkdir evidence
          node --test experiments/alife-interventions-r36/interventions.test.mjs | tee evidence/numerical.txt
          printf '%s\n' "$GITHUB_SHA" > evidence/source.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intervention-numerical-evidence
          path: evidence/
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium
      - name: Actual browser intervention and screenshot qualification
        run: |
          set -euo pipefail
          python3 -m http.server 5174 --bind 127.0.0.1 > /tmp/intervention-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/wait-for-server.mjs http://127.0.0.1:5174/
          node experiments/alife-interventions-r36/browser-smoke.mjs
          printf '%s\n' "$GITHUB_SHA" > intervention-evidence/source.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intervention-browser-evidence
          path: intervention-evidence/
          retention-days: 14
  native-integration:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npx playwright install chromium
      - name: Exercise actual integrated Arena on native Metal
        run: |
          set -euo pipefail
          python3 -m http.server 5174 --bind 127.0.0.1 > "$RUNNER_TEMP/intervention-native.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/wait-for-server.mjs http://127.0.0.1:5174/
          node experiments/alife-interventions-r36/native-smoke.mjs
          printf '%s\n' "$GITHUB_SHA" > native-intervention-evidence/source.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-intervention-evidence
          path: native-intervention-evidence/
          retention-days: 30
