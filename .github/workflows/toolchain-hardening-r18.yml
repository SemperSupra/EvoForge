name: Toolchain hardening RDTE
on:
  push:
    branches: [rdte/toolchain-hardening-r18]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'SemperSupra/EvoForge' && github.ref == 'refs/heads/rdte/toolchain-hardening-r18'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [major-audit-fix, major-no-wait-on]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit baseline and propose lock update
        env:
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p evidence
          npm audit --json > evidence/baseline-audit.json || test "$?" -eq 1
          npm install --save-dev --package-lock-only --ignore-scripts vite@latest vitest@latest
          if [ "$MODE" = major-no-wait-on ]; then
            npm uninstall --save-dev --package-lock-only --ignore-scripts wait-on
          fi
          npm audit fix --package-lock-only --ignore-scripts || test "$?" -eq 1
          cp package.json package-lock.json evidence/
          node --version > evidence/node-version.txt
          npm --version > evidence/npm-version.txt
          npm audit --json > evidence/candidate-audit.json || test "$?" -eq 1
          npm audit --omit=dev --audit-level=low
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck && npm test && npm run build && npm run verify:dist
      - name: Browser goldens
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > evidence/vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true; wait "$vite_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'const end=Date.now()+60000; for(;;){try{const r=await fetch("http://127.0.0.1:5173/",{signal:AbortSignal.timeout(1000),redirect:"error"});if(r.ok){await r.body?.cancel();break}await r.body?.cancel()}catch{}if(Date.now()>=end)throw Error("Vite readiness timeout");await new Promise(r=>setTimeout(r,250))}'
          npm run golden:test | tee evidence/golden.log
      - name: Development advisory gate
        run: npm audit --audit-level=low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-${{ matrix.mode }}
          path: evidence/
          retention-days: 3
