name: R50 live arena strike integration qualification
on:
  push:
    branches: [rdte/alife-strikes-r50]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- --exclude scripts/wait-for-server.test.mjs
  native:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run build
      - run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 5174 --strictPort --base / >/tmp/r50.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/wait-for-server.mjs http://127.0.0.1:5174/
          node experiments/alife-strikes-r50/native-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r50-native-strike-evidence
          path: native-intervention-evidence/
          retention-days: 30
