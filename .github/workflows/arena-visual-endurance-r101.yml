name: R101 native Arena visual, display governor and endurance
on:
  pull_request:
    branches: [rdte/integrated-experience-r90]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- --exclude scripts/wait-for-server.test.mjs
      - run: node --test scripts/wait-for-server.test.mjs
      - run: npm run build
      - run: npm run verify:dist
  native:
    strategy:
      fail-fast: false
      matrix:
        lane: [visual, governor, endurance, foundation, strike, aftermath]
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run build
      - run: node experiments/arena-r101/native.mjs ${{ matrix.lane }}
        if: contains(fromJSON('["visual","governor","endurance"]'), matrix.lane)
      - run: node experiments/arena-foundation-r76/native.mjs
        if: matrix.lane == 'foundation'
      - run: node experiments/arena-strike-r77/native.mjs
        if: matrix.lane == 'strike'
      - run: node experiments/arena-aftermath-r78/native.mjs
        if: matrix.lane == 'aftermath'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r101-${{ matrix.lane }}
          path: |
            arena-r101-*/
            foundation-evidence/
            strike-recovery-evidence/
            aftermath-evidence/
          retention-days: 30
