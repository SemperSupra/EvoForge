name: R40 matched-seed native motion comparison
on:
  push:
    branches: [rdte/alife-naturalism-r40]
    paths: ['experiments/alife-motion-r40/**','.github/workflows/alife-motion-r40.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: node experiments/alife-motion-r40/compare.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: matched-native-motion
          path: motion-evidence/
          retention-days: 30
