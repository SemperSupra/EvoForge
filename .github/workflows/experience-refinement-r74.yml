name: R74 viewport and tooltip refinement
on:
  push:
    branches: [rdte/experience-refinement-r74]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- --exclude scripts/wait-for-server.test.mjs
      - run: npm run build
      - run: npm run verify:dist
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: firefox
          - os: ubuntu-24.04
            browser: webkit
          - os: windows-latest
            browser: chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: runner.os == 'Linux'
      - run: npx playwright install ${{ matrix.browser }}
        if: runner.os == 'Windows'
      - run: npm run build
      - run: node experiments/launcher-gallery-r61/smoke.mjs ${{ matrix.browser }}
      - run: node experiments/human-ux-r58/mosaic.mjs ${{ matrix.browser }}
      - run: node experiments/human-experience-r65/reduced-motion.mjs ${{ matrix.browser }}
      - run: node experiments/icon-theme-r73/browser.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r74-human-${{ matrix.browser }}
          path: |
            launcher-evidence/
            ux-evidence/
            reduced-motion-evidence/
            chrome-evidence/
          retention-days: 30
  metal:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run build
      - run: node experiments/human-ux-r58/arena.mjs
      - run: node experiments/icon-theme-r73/native.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r74-native-arena-ux
          path: |
            ux-evidence/
            chrome-native-evidence/
          retention-days: 30
